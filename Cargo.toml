[package]
name = "slop-id"
version = "0.3.0"
edition = "2024"
description = "Deterministic local task-memory protocol for humans and agents"
license = "MIT"
repository = "https://github.com/dliv/slopid"
homepage = "https://github.com/dliv/slopid"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fastrand = "2"
ignore = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
unicode-segmentation = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[[bin]]
name = "sid"
path = "src/bin/sid.rs"
