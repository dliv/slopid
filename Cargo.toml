[package]
name = "slop-id"
version = "0.5.0"
edition = "2024"
description = "Local folder identity and allocation CLI for humans and agents"
license = "MIT"
repository = "https://github.com/dliv/slopid"
homepage = "https://github.com/dliv/slopid"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slop-id-identity-core = { path = "crates/identity/core" }
slop-id-identity-fs = { path = "crates/identity/fs" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[[bin]]
name = "sid"
path = "src/bin/sid.rs"

[workspace]
members = ["crates/policy", "crates/identity/core", "crates/identity/fs"]
resolver = "3"

[lints]
workspace = true

[workspace.lints.rust]
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_macros = "deny"
