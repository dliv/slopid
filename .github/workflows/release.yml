name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validation:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate tagged source
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Install just
        run: cargo install just --locked --version 1.57.0
      - run: just check

  build:
    needs: validation
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-26
            architecture: arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            architecture: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin sid

      - name: Package
        env:
          VERSION: ${{ needs.validation.outputs.version }}
        run: |
          set -euo pipefail
          NAME="sid-${{ matrix.target }}"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/sid dist/$NAME
          test "$(lipo -archs "dist/$NAME")" = '${{ matrix.architecture }}'
          test "$("dist/$NAME" --version)" = "sid $VERSION"
          (cd dist && COPYFILE_DISABLE=1 tar czf "$NAME.tar.gz" "$NAME")
          test "$(tar -tzf "dist/$NAME.tar.gz")" = "$NAME"
          tar -xOf "dist/$NAME.tar.gz" "$NAME" | cmp - "dist/$NAME"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/sid-${{ matrix.target }}.tar.gz

  update-homebrew:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          REPO="dliv/slopid"
          TAP_REPO="dliv/homebrew-tools"
          BIN="sid"

          AARCH64_URL="https://github.com/$REPO/releases/download/v$VERSION/${BIN}-aarch64-apple-darwin.tar.gz"
          X86_64_URL="https://github.com/$REPO/releases/download/v$VERSION/${BIN}-x86_64-apple-darwin.tar.gz"

          curl -fSL -o aarch64.tar.gz "$AARCH64_URL"
          curl -fSL -o x86_64.tar.gz "$X86_64_URL"

          AARCH64_SHA=$(sha256sum aarch64.tar.gz | cut -d' ' -f1)
          X86_64_SHA=$(sha256sum x86_64.tar.gz | cut -d' ' -f1)

          FORMULA="Formula/${BIN}.rb"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/$TAP_REPO.git" tap
          cd tap

          sed -i "s/version \".*\"/version \"$VERSION\"/" "$FORMULA"
          sed -i "/CPU.arm?/{n;n;s/sha256 \"[a-f0-9]\{64\}\"/sha256 \"$AARCH64_SHA\"/}" "$FORMULA"
          sed -i "/CPU.intel?/{n;n;s/sha256 \"[a-f0-9]\{64\}\"/sha256 \"$X86_64_SHA\"/}" "$FORMULA"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA"
          git diff --cached --quiet && echo "No changes to formula" && exit 0
          git commit -m "chore: bump $BIN to $VERSION"
          git push
